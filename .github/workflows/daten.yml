# Daten-Pipeline: swisstopo-Daten holen und für Swiss Sky aufbereiten (läuft auf GitHub, nicht im Spiel)
# Start: Push auf den Zweig «pipeline» oder von Hand (Actions → Daten → Run workflow). Ergebnis: Zweig «daten-out».
name: Daten
on:
  workflow_dispatch:
  push:
    branches: [pipeline]
    paths: ['tools/pipeline/**', '.github/workflows/daten.yml']
permissions:
  contents: write
jobs:
  daten:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: GDAL installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin python3-gdal python3-numpy python3-pil > /dev/null && gdalinfo --version
      # Welche Schritte laufen: Wörter in tools/pipeline/jobs.txt (terrain sb3d ortho osm fine forest); ohne Datei alle alten
      - name: Höhenmodell swissALTIRegio
        run: if ! test -f tools/pipeline/jobs.txt || grep -qw terrain tools/pipeline/jobs.txt; then set -o pipefail; python3 tools/pipeline/terrain_fetch.py out 2>&1 | tee -a out_log.txt; fi
      - name: Gebäude swissBUILDINGS3D (Regionalflugplätze)
        run: if ! test -f tools/pipeline/jobs.txt || grep -qw sb3d tools/pipeline/jobs.txt; then set -o pipefail; python3 tools/pipeline/sb3d_fetch.py out 2>&1 | tee -a out_log.txt; fi
      - name: Luftbilder SWISSIMAGE (Flughäfen)
        run: if ! test -f tools/pipeline/jobs.txt || grep -qw ortho tools/pipeline/jobs.txt; then set -o pipefail; python3 tools/pipeline/ortho_fetch.py out 2>&1 | tee -a out_log.txt; fi
      - name: Gebäude-Grundrisse OpenStreetMap (Luftbild-Gebiete)
        run: if ! test -f tools/pipeline/jobs.txt || grep -qw osm tools/pipeline/jobs.txt; then set -o pipefail; python3 tools/pipeline/osm_buildings.py out 2>&1 | tee -a out_log.txt; fi
      - name: Feines Höhenmodell (30 m)
        run: if test -f tools/pipeline/jobs.txt && grep -qw fine tools/pipeline/jobs.txt; then set -o pipefail; python3 tools/pipeline/terrain_fine.py out 2>&1 | tee -a out_log.txt; fi
      - name: Wald LFI (30 m)
        if: always()
        run: if test -f tools/pipeline/jobs.txt && grep -qw forest tools/pipeline/jobs.txt; then set -o pipefail; python3 tools/pipeline/forest_fine.py out 2>&1 | tee -a out_log.txt; fi
      - name: Ergebnis auf Zweig daten-out
        if: always()
        run: |
          mkdir -p out && cp out_log.txt out/log.txt 2>/dev/null || true
          find out -name '*.tif' -delete; find out -size +95M -delete
          cd out && git init -q && git checkout -q -b daten-out && git add -A
          git -c user.name=daten-pipeline -c user.email=actions@users.noreply.github.com commit -qm "Daten aus ${GITHUB_SHA::7} (${{ job.status }})"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" daten-out
